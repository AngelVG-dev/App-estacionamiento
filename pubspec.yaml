name: car_gps
description: "A new Flutter project."
publish_to: 'none'
version: 0.2.0

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
# mapeo y rutas
  flutter_map: ^6.1.0
  flutter_map_tile_caching: ^9.0.0
  latlong2: ^0.9.0
  http: ^1.1.0
  # gps y segundo
  geolocator: ^10.1.0
  geofence_service: ^6.0.0+1
  # persistencia
  shared_preferences: ^2.2.2
  image_picker: ^1.0.4
  sqflite: ^2.3.0        
  path: ^1.9.0           
  path_provider: ^2.1.1
  # notificaciones
  flutter_local_notifications: ^17.1.2
  vibration: ^2.0.0
  supabase_flutter: ^2.3.1
  flutter_dotenv: ^5.1.0
  #diseño
  google_fonts: ^6.1.0
  animate_do: ^3.3.4
  # compartir y permisos
  share_plus: ^7.2.2
  permission_handler: ^11.3.0
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1 #iconos

flutter:
  uses-material-design: true
  assets:
    - lib/assets/car.png #iconos
    - .env 


flutter_launcher_icons:
  android: "ic_launcher" 
  ios: true 
  image_path: "lib/assets/logo.png" 
  min_sdk_android: 21 
